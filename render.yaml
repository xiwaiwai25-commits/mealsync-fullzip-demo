services:
  - type: web
    name: mealsync-fullzip-api-6d91c3a2
    runtime: python
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: MEALSYNC_SECRET
        generateValue: true
      - key: MEALSYNC_ADMIN_PASSWORD
        value: admin123
      - key: MEALSYNC_ADMIN_EMAIL
        value: admin@mealsync.test
      - key: MEALSYNC_CORS_ORIGINS
        value: "*"
      - key: MEALSYNC_SEED_DEMO_DATA
        value: "false"
      - key: MEALSYNC_DB_PATH
        value: /tmp/mealsync-fullzip.db
      - key: MEALSYNC_MEDIA_DIR
        value: /tmp/mealsync-fullzip-uploads

  - type: web
    name: mealsync-fullzip-web-6d91c3a2
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://mealsync-fullzip-api-6d91c3a2.onrender.com/api
